services:
  gopdshelf:
    build: .
    container_name: gopdshelf
    ports:
      - "3000:3000"
    volumes:
      - ./books:/app/books
      - ./data:/app/data
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      BOOKS_DIR: /app/books
      DATABASE_PATH: /app/data/gopdshelf.db
